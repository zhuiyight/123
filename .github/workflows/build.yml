name: 一键构建前后端
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-all:
    runs-on: windows-latest
    steps:
      - name: 下载后端源码
        uses: actions/checkout@v4
        with:
          repository: zhuiyight/xiaochan
          path: backend

      - name: 安装Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23

      - name: 编译后端
        run: |
          cd backend
          go mod tidy
          go build -ldflags "-s -w" -o xiaochan.exe

      - name: 下载前端源码
        uses: actions/checkout@v4
        with:
          repository: zhuiyight/xiaocan-front
          path: frontend

      - name: 安装Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 构建前端
        run: |
          cd frontend
          npm install
          npm run build

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: Windows运行包
          path: |
            backend/xiaochan.exe
            frontend/dist
