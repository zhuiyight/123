name: 一键拉取+构建前后端
on:
  workflow_dispatch: push

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 1. 新建工作目录
      - name: 创建文件夹
        run: |
          mkdir xiaochan
          mkdir front

      # 2. 克隆【后端仓库】把下面链接换成你的后端github地址
      - name: 拉取Go后端源码
        uses: actions/checkout@v4
        with:
          repository: zhuiyight/xiaochan
          path: xiaochan

      # 3. 编译后端Windows exe
      - name: 安装Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: 编译后端
        run: |
          cd xiaochan
          go mod tidy
          go build -ldflags "-s -w" -o xiaochan.exe

      # 4. 克隆【前端仓库】换成你的前端github地址
      - name: 拉取前端源码
        uses: actions/checkout@v4
        with:
          repository: zhuiyight/xiaocan-front
          path: front

      # 5. 打包前端dist
      - name: 安装Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 打包前端
        run: |
          cd front
          npm install
          npm run build

      # 6. 上传全部成品
      - name: 上传运行包
        uses: actions/upload-artifact@v4
        with:
          name: Windows全套运行文件
          path: |
            xiaochan/xiaochan.exe
            front/dist/
