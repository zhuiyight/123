name: 一键构建前后端
# 关键：标准触发配置，解决流程图不显示
on:
  # 网页手动运行
  workflow_dispatch:
  # 推送代码自动运行
  push:
    branches: [ main, master ]

jobs:
  build-all:
    runs-on: windows-latest
    steps:
      # 克隆后端仓库【改成你的后端仓库地址】
      - name: 下载后端源码
        uses: actions/checkout@v4
        with:
          repository: zhuiyight/xiaochan
          path: ./backend

      # 编译Go后端
      - name: 安装Go环境
        uses: actions/setup-go@v5
        with:
          go-version: 1.23
      
      - name: 编译Windows程序
        run: |
          cd ./backend
          go mod tidy
          go build -ldflags "-s -w" -o xiaochan.exe

      # 克隆前端仓库【改成你的前端仓库地址】
      - name: 下载前端源码
        uses: actions/checkout@v4
        with:
          repository: zhuiyight/xiaocan-front
          path: ./frontend

      # 打包前端
      - name: 安装Node环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: 构建前端静态文件
        run: |
          cd ./frontend
          npm install
          npm run build

      # 上传成品，下载直接在电脑运行
      - name: 打包上传成品
        uses: actions/upload-artifact@v4
        with:
          name: Windows-全套运行包
          path: |
            backend/xiaochan.exe
            frontend/dist/
