name: 一键构建前后端
on:
  workflow_dispatch
  push:
    branches: [ main, master ]

jobs:
  build-all:
    runs-on: windows-latest
    steps:
      # 拉取后端仓库
      - name: 拉取后端源码
        uses: actions/checkout@v4
        with:
          repository: zhuiyight/xiaochan
          path: ./backend

      # 安装Go
      - name: 安装Go环境
        uses: actions/setup-go@v5
        with:
          go-version: 1.23

      # 【重点】自动进入真实项目目录+编译
      - name: 编译后端EXE
        run: |
          cd ./backend
          # 自动进到有go.mod的目录（99%你的代码在src/ 或者 项目同名文件夹）
          if(Test-Path "go.mod"){
            go mod tidy
            go build -ldflags "-s -w" -o xiaochan.exe
          }else{
            cd src
            go mod tidy
            go build -ldflags "-s -w" -o xiaochan.exe
          }

      # 拉取前端仓库
      - name: 拉取前端源码
        uses: actions/checkout@v4
        with:
          repository: zhuiyight/xiaocan-front
          path: ./frontend

      # 安装Node打包前端
      - name: 安装Node环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: 打包前端dist
        run: |
          cd ./frontend
          npm install
          npm run build

      # 上传成品
      - name: 上传运行包
        uses: actions/upload-artifact@v4
        with:
          name: Windows-全套运行包
          path: |
            backend/xiaochan.exe
            backend/src/xiaochan.exe
            frontend/dist/
